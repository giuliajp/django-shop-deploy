upstream django_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Максимальный размер загружаемого файла
    client_max_body_size 20M;

    # Статика, собранная командой collectstatic
    location /static/ {
        alias /app/static/;
        expires 7d;
    }

    # Загруженные пользователями файлы (MEDIA_ROOT = uploads)
    location /media/ {
        alias /app/uploads/;
    }

    # Всё остальное — в Django (gunicorn)
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}